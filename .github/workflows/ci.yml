name: Library and independent consumers
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '8'
      - name: Remember test JVM
        run: echo "BOUNDARY_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify library and direct test dependencies
        run: sh verify-example.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: verification
          path: |
            build/reports/tests/
            build/consumer-results/
          if-no-files-found: error
