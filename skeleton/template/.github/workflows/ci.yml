name: Application and architecture boundary
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '11'
      - name: Remember minimum runtime JVM
        run: echo "RUNTIME_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '17'
      - name: Build on JDK 17 and verify on Java 11
        run: sh gradlew --no-daemon --console=plain "-PruntimeJavaHome=$RUNTIME_JAVA_HOME" clean check run
      - name: Preserve boundary test reports
        if: ${{ !cancelled() && hashFiles('build/test-results/test/*.xml') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: boundary-test-results-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/test-results/test/*.xml
            build/reports/tests/test/
          retention-days: 14
          if-no-files-found: error
